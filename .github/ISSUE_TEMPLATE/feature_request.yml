name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or the study habit this would help with.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Kardo to do?
  - type: checkboxes
    id: rules
    attributes:
      label: Fits Kardo's ground rules
      options:
        - label: This can be done without adding runtime dependencies or a build step
