name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the test suite (standard library only, nothing to install)
        run: python -m unittest discover -s tests -v

  docker:
    name: Docker image builds and answers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t kardo:ci .
      - name: Start, import a sample deck, check health
        run: |
          docker run -d --name kardo -p 8484:8484 kardo:ci
          for i in $(seq 1 30); do curl -fs http://localhost:8484/api/health && break; sleep 1; done
          curl -fs -X POST --data-binary @samples/geography-flags-capitals.apkg \
            "http://localhost:8484/api/import?filename=geo.apkg" | tee /dev/stderr | grep -q '"added": 62'
          curl -fs http://localhost:8484/api/decks | grep -q "Flags & Capitals"
          curl -fs http://localhost:8484/ | grep -q "<title>Kardo</title>"
      - name: Logs
        if: always()
        run: docker logs kardo
